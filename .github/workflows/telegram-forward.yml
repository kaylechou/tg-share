name: Forward files to Telegram

# 转发专用仓库：任何文件推送到 main 即自动同步到 TG，也可手动指定文件发送。
# 需要的仓库 secret：TELEGRAM_BOT_TOKEN、TELEGRAM_CHAT_ID。

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: "Repo path of a file to send (optional)"
        required: false
        default: ""
      message:
        description: "Text message to send first (optional)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      # 临时：搬运 16 个旧文件期间不触发 TG 同步（搬完即删）
      - 'liquid-glass-avatar-v6-bright-6000.png'
      - 'liquid-glass-avatar-v6-bright.png'
      - 'liquid-glass-avatar-v6-google-bright.png'
      - 'liquid-glass-avatar-v6-google.png'
      - 'liquid-glass-avatar-v6.png'
      - 'liquid-glass-moments-bg-lively-bright.png'
      - 'liquid-glass-moments-bg-lively.png'
      - 'liquid-glass-youtube-banner-bold-bright-2560x1440.png'
      - 'liquid-glass-youtube-banner-bold-bright.png'
      - 'liquid-glass-youtube-banner-bold.png'
      - 'liquid-glass-youtube-banner-v2-bright-2560x1440.png'
      - 'liquid-glass-youtube-banner-v2-bright.png'
      - 'liquid-glass-youtube-banner-v2.png'
      - 'youtube-banner-jkspace-liquid-glass-10s-1080p.mp4'
      - 'youtube-banner-jkspace-liquid-glass-5s-1080p.mp4'
      - '从灰心到见证.pptx'

jobs:
  send_dispatched:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send file to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILE_PATH: ${{ inputs.file_path }}
          MESSAGE: ${{ inputs.message }}
        run: python3 .github/scripts/send_to_tg.py

  sync_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send pushed files to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/send_to_tg.py --sync
